name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Manual gate. The npm trusted publisher names this environment, so the OIDC
    # token is only minted after a listed reviewer approves the job. Stripping
    # this line to skip the approval yields a token with no environment claim,
    # which npm rejects — use the approval prompt, not a workflow edit.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install verification dependencies
        run: |
          npm ci
          npm ci --prefix agents/backends/codex/subagent-config
          npm ci --prefix agents/backends/codex/subagent-config/web

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$PACKAGE_VERSION"

      - name: Verify distributable package
        run: |
          node --check bin/my-workbench.js
          node bin/my-workbench.js --help
          npm run verify
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes --verify-tag
