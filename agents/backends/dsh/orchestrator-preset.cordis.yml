# The MyWorkbench ORCHESTRATOR preset's plugin list, in the order DSH activates
# it. `my-workbench --dsh` indents this file under
# `config.plugins:` of the `preset-my-workbench` declaration it writes into
# <DSH_HOME>/cordis.patch.yml — DSH 0.2.x reads presets from declarations, never
# from a preset directory.
#
# This file is assembled from agents/ source — never edit the installed copy:
#   a `prompt:<agent>` placeholder becomes agents/prompts/<agent>.md verbatim,
#   and the `slot:dispatch` placeholder inside the orchestrator prompt comes
#   from agents/backends/dsh/slots/dispatch.md, as for every other backend.
# `lane-plugin` is replaced at install time by the absolute file: URL of the
# installed lane plugin module.
#
# The SPECIALIST personas are not here: each specialist is its own child preset
# (`preset-my-workbench-<lane>`, generated from agents/backends/dsh/lanes.json
# and agents/prompts/<lane>.md). That is the only way DSH 0.2.x expresses a
# subagent's identity and tool restrictions — `SubagentStartRequest` has neither
# `persona` nor `toolFilter`; both come from the preset the child mounts.
#
# This is an AGENT-PLANE plugin list. The `subagents` registry, the sandbox and
# approval stack, persistence, and the model route stay in the HOST composition;
# this file contributes one agent's tools and prompt sections. A row that
# PUBLISHES a service must sit inside a group carrying an `isolate` realm (see
# the planning and compaction groups below) or the mount is rejected. A row that
# only registers tools or consumes host services must stay OUTSIDE such a realm,
# or it resolves a private instance this preset never populated. The lane plugin
# only registers tools and consumes host services, so it sits outside any realm.
#
# Deliberately omitted from the shipped `standard` preset: the anonymous
# `subagent`/`subagent_fork` tools and the `workflow`/`ralph` tools. Here every
# delegation names a specialist, mirroring the Task-with-subagent_type flow the
# prompts were written for. Add `@deepseek-ai/dsh-tool-subagent` rows if you want
# the anonymous tool back.

# ── identity ────────────────────────────────────────────────────────────────

# The orchestrator prompt is the persona: it owns planning, routing, and
# verification, and it must not implement serially. `{{model}}` resolves from
# the agent's own route; the working directory arrives as required user context
# from the working-directory service, so a `suffix` with `{{cwd}}` would fail
# prompt assembly (that variable was removed in DSH 0.2).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      {{prompt:orchestrator}}

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# ── shell ───────────────────────────────────────────────────────────────────

# The shell registry and its executors stay in the HOST composition; one of
# these two rows is live per platform, and `shell-env` (DSH_WEB_URL and friends)
# reaches the model's shell from there.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host. `apply_patch` stays
# off (the 0.2.x default): the orchestrator delegates implementation.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# The task registry stays host-side; this row gives the agent the model-facing
# controls, which the orchestrator prompt relies on for tracking lanes.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature: an entry-local realm is the correct
# lifetime, not a workaround. The specialist lanes sit OUTSIDE this realm, so
# plan mode cannot bind them; the section text carries the delegation gate
# (read-only lanes only) explicitly instead.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery. Delegating implementation to a specialist lane is implementation, not exploration: while in plan mode, dispatch only read-only lanes (explorer, librarian, oracle, observer, improver); write-capable or artifact-producing lanes such as fixer or designer wait until the plan is approved.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm. `tokenMeter` stays on the HOST plane — the rows here resolve
# that one instance, since the browser reads its context-meter projection for
# every session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation: the specialist roster ───────────────────────────────────────

# The `subagents` registry and its spawn backend stay in the HOST composition
# (the registry answers cross-session queries and a provider name registers
# once), so the rows here only register tools and need no realm.
#
# The control row registers `send_message`, `wait_agent`, `list_agents` and
# `interrupt_agent` in one main entry (the old `/list-agents` subpath export is
# gone). `interrupt` keeps its default (enabled) because the dispatch guidance
# tells the model to stop a lane with `interrupt_agent`.
#
# The seven specialist tools live in ONE packaged plugin row (`lanes`, below).
# Each tool starts its child under that lane's preset
# (`preset-my-workbench-<lane>`), which carries the persona and the restricted
# tool set; the plugin itself grants nothing. Model routing is configurable per
# lane in <DSH_HOME>/my-workbench-lanes.json (installed as this row's `pins`);
# every lane starts on 继承会话模型 and inherits the session's route.
#
# The universal disciplines reach each lane the same way a lane's persona does:
# assembly appends them (agents/disciplines.md) to every agent prompt, so both
# the lane preset persona and the delegation brief stay free of repeated rules.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    # The lane plugin. It owns the seven delegation tools and registers them in
    # THIS preset's scope, so they exist for MyWorkbench sessions only — no other
    # preset gains a tool, and nothing is mounted at profile level.
    #
    # `name` is an absolute `file:` URL baked by `my-workbench --dsh`: a preset
    # declaration is mounted by the profile's Loader, so a relative name would
    # resolve from the profile directory, not from any preset directory.
    - id: lanes
      name: '{{lane-plugin}}'
      config:
        maxDepth: 1
        {{lane-pins}}

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The orchestrator prompt's "Todo continuity" rule assumes a durable task list.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. librarian depends on it.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
