# The `dsh` backend's agent preset: the my-workbench multi-agent setup for
# DeepSeek Harness (DSH) — one orchestrator persona plus the lane plugin, which
# owns the seven named specialist delegation tools. Installed by
# `my-workbench --dsh` as <DSH_HOME>/.agent-presets/my-workbench/agent.cordis.yml,
# beside the plugin itself at
# <DSH_HOME>/.agent-presets/my-workbench/lane-plugin/; DSH reads a preset when a
# session mounts it, so a new session is needed to pick it up.
#
# This file is assembled from agents/ source — never edit the installed copy:
#   a `prompt:<agent>` placeholder becomes agents/prompts/<agent>.md verbatim,
#   and the `slot:dispatch` placeholder inside the orchestrator prompt comes
#   from agents/backends/dsh/slots/dispatch.md, as for every other backend.
# The SPECIALIST prompts no longer appear here: the lane plugin's own generated
# module carries them, rendered from the same agents/prompts/*.md by the same
# CLI. `designer` is deliberately absent as a composition row: the design-only
# designer is carried as a lane by the plugin's generated module, like the other
# specialists.
#
# This is an AGENT-PLANE composition. The `subagents` registry, the sandbox and
# approval stack, persistence, and the model route stay in the HOST composition;
# this file contributes one agent's tools and prompt sections. A row that
# PUBLISHES a service must sit inside a group carrying an `isolate` realm (see
# the planning and compaction groups below) or the mount is rejected. A row that
# only registers tools or consumes host services must stay OUTSIDE such a realm,
# or it resolves a private instance this preset never populated. The lane plugin
# only registers tools and consumes host services, so it sits outside any realm.
#
# Deliberately omitted from the shipped `standard` preset: the anonymous
# `subagent`/`subagent_fork` tools and the `workflow`/`ralph` engines. Here every
# delegation names a specialist, mirroring the Task-with-subagent_type flow the
# prompts were written for. Copy those rows from the shipped composition if you
# want them back.

# ── identity ────────────────────────────────────────────────────────────────

# The orchestrator prompt is the persona: it owns planning, routing, and
# verification, and it must not implement serially. `{{model}}`/`{{cwd}}`
# resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |
      {{prompt:orchestrator}}

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# The shell registry and its executors stay in the HOST composition; one of
# these two rows is live per platform, and `shell-env` (DSH_WEB_URL and friends)
# reaches the model's shell from there.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# The task registry stays host-side; this row gives the agent the model-facing
# controls, which the orchestrator prompt relies on for tracking lanes.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature: an entry-local realm is the correct
# lifetime, not a workaround. The specialist lanes sit OUTSIDE this realm, so
# plan mode cannot bind them; the section text carries the delegation gate
# (read-only lanes only) explicitly instead.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery. Delegating implementation to a specialist lane is implementation, not exploration: while in plan mode, dispatch only read-only lanes (explorer, librarian, sentinel, observer, improver); write-capable or artifact-producing lanes such as fixer or designer wait until the plan is approved.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm. `tokenMeter` stays on the HOST plane — the rows here resolve
# that one instance, since the browser reads its context-meter projection for
# every session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation: the specialist roster ───────────────────────────────────────

# The `subagents` registry and its spawn backend stay in the HOST composition
# (the registry answers cross-session queries and a provider name registers
# once), so the rows here only register tools and need no realm.
#
# The seven specialist lanes live in ONE packaged plugin row (`lanes`, below),
# not in seven `@deepseek-ai/dsh-tool-subagent` rows. The plugin owns the tools,
# which is what lets it read each lane's model/reasoning-effort pin from its own
# persisted settings namespace and apply that lane's read-only `toolFilter`
# itself — neither is expressible in a composition row. The lanes keep their
# names (`subagent_explorer` … `subagent_improver`), their prompts come from
# agents/prompts/*.md, and their restrictions are unchanged:
#   * read-only lanes lose `write`/`edit` (observer and improver also lose the
#     shell), so "READ-ONLY" is enforced, not merely requested;
#   * every lane loses all seven delegation tools, so a lane cannot spawn lanes.
# Model routing now lives in the plugin's settings namespace (settings →
# MyWorkbench 赛道模型), seeded from the plugin's recommended mapping; see
# docs/dsh-lane-plugin/PLAN.md and lane-plugin/host-package/src/index.js.
#
# The universal disciplines reach each lane the same way a lane's persona does:
# assembly appends them (agents/disciplines.md) to every agent prompt the plugin
# delivers to a child, so no delegation brief carries them (bin/my-workbench.js,
# agentPromptBody).
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # The lane plugin. It owns the seven delegation tools and registers them in
    # THIS preset's scope, so they exist for MyWorkbench sessions only — no other
    # preset gains a tool, and the settings page it publishes is inert outside
    # MyWorkbench. Background-first (continuable) delegation is unchanged: a call
    # returns a durable child id, and `run_in_background: false` waits for the
    # final text.
    #
    # `name` is RELATIVE on purpose. A preset row's bare package name resolves
    # from the host composition's base, not from this preset's directory, so a
    # package shipped alongside the composition would not be found; a
    # `./`-relative name resolves against the composition's own directory, which
    # is where `my-workbench --dsh` puts the plugin. That is what keeps the
    # install free of profile-level writes and dependency commands.
    #
    # The plugin must be named by THIS preset only: it registers a settings
    # namespace, and DSH refuses a duplicate registration, so a second preset
    # mounting the same row would fail loudly.
    - id: lanes
      name: ./lane-plugin/src/index.js
      config:
        maxDepth: 3

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The orchestrator prompt's "Todo continuity" rule assumes a durable task list.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. librarian depends on it.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
