[package]
name = "workbench-core"
version = "0.14.0"
edition = "2021"
description = "Pure Rust port of the my-workbench deployment engine (no Tauri dependency)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
home = "0.5"
walkdir = "2"
regex = "1"
dunce = "1"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
