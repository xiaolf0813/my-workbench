[package]
name = "my-workbench-desktop"
version = "0.13.0"
description = "my-workbench desktop GUI — Tauri 2 shell over the workbench-core engine."
edition = "2021"
license = "MIT"

[lib]
name = "my_workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "my-workbench-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
workbench-core = { path = "../crates/workbench-core" }
